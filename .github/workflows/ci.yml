name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      # Third-party actions are pinned by commit SHA (a tag can be moved, a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker daemon available on GitHub-hosted runners.
      - run: ./mvnw -B verify

  web:
    name: Web (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version read from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Builds the two images and publishes them to GitHub Container Registry, tagged with the commit
  # SHA. Only after the tests pass (needs), and only on main: a pull request publishes nothing.
  images:
    name: Image ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    # The workflow default is read-only; this job also needs to write packages.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: kitchen-api
            dockerfile: apps/api/Dockerfile
          - name: kitchen-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # GHCR wants a lowercase repository name. The tag is the full commit SHA: it never
          # moves, and it tells exactly which code a running pod comes from. No "latest" tag.
          tags: ghcr.io/jucollet/${{ matrix.name }}:${{ github.sha }}
          # Links the package to this repository, which lets GITHUB_TOKEN keep pushing to it.
          labels: org.opencontainers.image.source=https://github.com/JuCollet/kitchen-ai
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Promotion: once both images exist, point the cluster at them. The cluster is driven by
  # the homelab-deploy repository (ArgoCD), so deploying means committing the new image SHA
  # there. The deploy key below can write to that one repository and nothing else. Secrets
  # are never exposed to pull requests from forks, and this job only runs on a push to main.
  deploy:
    name: Promote to homelab
    if: github.event_name == 'push'
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One promotion at a time, in order: two quick merges must not race on the same files.
    concurrency:
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuCollet/homelab-deploy
          ref: main
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
      - name: Point the manifests at the new images
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i -E "s|(ghcr.io/jucollet/kitchen-api:)[0-9a-f]{40}|\1${SHA}|" prod/kitchen/api.yaml
          sed -i -E "s|(ghcr.io/jucollet/kitchen-web:)[0-9a-f]{40}|\1${SHA}|" prod/kitchen/web.yaml
          grep -q "kitchen-api:${SHA}" prod/kitchen/api.yaml
          grep -q "kitchen-web:${SHA}" prod/kitchen/web.yaml
          if git diff --quiet; then
            echo "Manifests already up to date."
            exit 0
          fi
          git config user.name "kitchen-ci"
          git config user.email "kitchen-ci@users.noreply.github.com"
          git commit -am "Deploy kitchen ${SHA:0:7}"
          git push origin HEAD:main
