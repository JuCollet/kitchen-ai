# Onboarding questions, asked by the AI in the person's language (OnboardingService).
# MessageFormat syntax: a single quote is written ''. {0} is the URL of the "My account" page.
onboarding.personal.diet=Do you follow a particular diet (vegetarian, vegan, halal, low-carb…), or do you eat everything?
onboarding.personal.allergies=Do you have any food allergies or intolerances? They will be shared with the other members of your household, so that every household menu is safe for you.
onboarding.personal.allergies.no_consent=Kitchen can only store allergies and intolerances once you have allowed it, because they are health data. If you want Kitchen to take them into account, enable it on your account page: {0}
onboarding.personal.dislikes=Are there any foods or dishes you don''t like?
onboarding.household.table_size=How many people usually eat at your table, children included?
onboarding.household.goals=What matters most to your household when cooking: eating healthier, saving time, saving money, discovering new dishes, something else?
onboarding.household.max_active_minutes=On a weekday, how much hands-on time can you spend cooking, at most?
onboarding.household.budget=Do you have a food budget in mind (per week, or per meal)?
onboarding.household.staples=Which basics do you always have at home (oil, rice, pasta, spices…), so that they are never added to the shopping list?
onboarding.household.appliances=Which cooking appliances do you use (oven, air fryer, multicooker, steam oven…)? For each one, give its brand and model if you know them: I will write its spec sheet for you to check.
onboarding.household.appliances.more=Do you have any other cooking appliance to add?

# MCP prompts (KitchenPrompts): the message the person sends to their AI with one click.
# Always formatted with MessageFormat (a single quote is written ''). Optional sentences are
# inserted ready-made, or left empty when the person gave no value.
prompt.weekly_menu=Plan our household menu for {1} days, starting {0}.{2}\n\n\
How to do it:\n\
1. Call get_context: respect every member''s dietary constraints and our appliance preferences, and look at the latest menu (avoid repeating it) and the pantry.\n\
2. Unless I say otherwise, plan dinners only, with portions for the people at our table.\n\
3. Build it mainly from our recipe book (search_recipes): favour recipes we all rated well and those not cooked recently. Only invent a recipe to fill a gap or add variety, and save it with save_recipe before using it.\n\
4. Show me the plan (day, meal, recipe, appliance) and let me change it.\n\
5. Once I agree, save it with create_menu, with the appliance choices for the period.\n\
6. Then make the shopping list for the whole menu with create_shopping_list (linked to the menu): quantities added up across recipes and adjusted to the portions, each with its store aisle, leaving out what the pantry already has and our staple ingredients. Show it with get_shopping_list.\n\
7. Finally, offer me the printable PDF of the menu (export_menu_pdf).
prompt.weekly_menu.appliances=\ Appliances for this period: {0}.
prompt.recipe_of_the_day=What should we cook today?{0}\n\n\
Call get_context, then suggest one recipe that respects every member''s dietary constraints and our appliance preferences, uses what is in the pantry where possible and fits our usual hands-on time. Look in our recipe book first (search_recipes), favouring recipes we all rated well and not cooked recently. If nothing fits, suggest a new recipe and offer to save it with save_recipe. Show it with its ingredients, steps and appliance settings.
prompt.recipe_of_the_day.craving=\ I feel like: {0}.
prompt.rate_a_recipe=I want to rate a recipe I cooked{0}.\n\n\
Call get_context: recipesToRate lists the recipes served recently that I have not rated yet; otherwise, find the recipe with search_recipes. Ask me for a score out of 10 (9 = perfect, nothing to change; 10 = the best recipe I have ever tasted), what I would change next time and a comment, then save it with rate_recipe. Then ask me which ingredients are used up, and remove them from the pantry with update_pantry.
prompt.rate_a_recipe.recipe=: {0}
prompt.clear_the_fridge=Suggest a recipe to use up what is left at home.{0}\n\n\
Call get_context and get_pantry, then suggest a recipe built mainly from what the pantry has, respecting every member''s dietary constraints and our appliance preferences. Look in our recipe book first (search_recipes with the main ingredients). Tell me clearly what is missing, if anything. Offer to save a new recipe with save_recipe, and once I have cooked it, to update the pantry with update_pantry.
prompt.clear_the_fridge.ingredients=\ Also use: {0}.

