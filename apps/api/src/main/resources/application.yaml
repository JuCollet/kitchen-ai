# Single configuration file, no per-environment profiles: anything that differs between
# environments (database URL, credentials, OAuth clients…) comes from environment variables.
# The datasource is not declared here:
# - locally, spring-boot-docker-compose derives it from compose.yaml;
# - in tests, Testcontainers provides it (@ServiceConnection);
# - in production, it comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (Kubernetes secret).
spring:
  application:
    name: kitchen-api
  config:
    # Local secrets (Google client) in apps/api/.env, never committed. See .env.example.
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, profile, email
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Do not keep a database session open for the whole HTTP request:
    # all data access must happen inside services.
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  messages:
    # messages*.properties (onboarding questions). English when the language has no bundle,
    # never the server's own locale.
    basename: messages
    fallback-to-system-locale: false
  ai:
    mcp:
      server:
        # Stateless Streamable HTTP: every request carries its token, any instance can answer it.
        protocol: STATELESS
        name: kitchen
        version: 0.8.0
        # The instructions (the brain) live in mcp/instructions.md, loaded by McpInstructions.
  threads:
    virtual:
      enabled: true

kitchen:
  # URL opened in the browser. Locally: the Vite dev server, which proxies the API.
  public-url: ${KITCHEN_PUBLIC_URL:http://localhost:5173}
  oauth:
    # RSA private key (PKCS#8 PEM) signing the AI clients' access tokens. Secret. Empty locally:
    # a temporary key is generated at startup.
    signing-key: ${KITCHEN_OAUTH_SIGNING_KEY:}
  mcp:
    # Browser origins allowed on /mcp besides the site itself (MCP Inspector in development).
    allowed-origins: ${KITCHEN_MCP_ALLOWED_ORIGINS:http://localhost:6274,http://127.0.0.1:6274}

server:
  # Trust X-Forwarded-Host/Proto: the API is only reachable through a proxy that sets them
  # (Traefik in production, the Vite dev server locally). Needed to build the right Google
  # redirect URI and to know the request came over HTTPS.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: KITCHEN_SESSION
        # Not readable from JavaScript, only sent over HTTPS (browsers treat localhost as secure),
        # not sent with cross-site requests except top-level navigation.
        http-only: true
        secure: true
        same-site: lax
  # Never leak stack traces or exception messages to clients.
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. env, beans, heapdump… leak configuration and memory.
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes.
      probes:
        enabled: true
