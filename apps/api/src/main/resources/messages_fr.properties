prompt.weekly_menu=Prépare le menu de notre foyer pour {1} jours, à partir du {0}.{2}\n\n\
Comment faire :\n\
1. Appelle get_context : respecte les contraintes alimentaires de chaque membre et nos préférences d''appareils, et regarde le dernier menu (évite de le répéter) et le garde-manger.\n\
2. Sauf si je dis autre chose, prévois uniquement les dîners, avec des portions pour les personnes à notre table.\n\
3. Construis-le surtout à partir de notre livre de recettes (search_recipes) : privilégie les recettes que nous avons tous bien notées et celles qu''on n''a pas cuisinées récemment. N''invente une recette que pour combler un manque ou varier, et enregistre-la avec save_recipe avant de l''utiliser.\n\
4. Montre-moi le plan (jour, repas, recette, appareil) et laisse-moi le modifier.\n\
5. Quand je suis d''accord, enregistre-le avec create_menu, avec les choix d''appareils pour la période.\n\
6. Fais ensuite la liste de courses de tout le menu avec create_shopping_list (liée au menu) : quantités additionnées entre les recettes et adaptées aux portions, chacune avec son rayon, sans ce que le garde-manger contient déjà ni nos ingrédients de base. Affiche-la avec get_shopping_list.
prompt.weekly_menu.appliances=\ Appareils pour cette période : {0}.
prompt.recipe_of_the_day=Qu''est-ce qu''on cuisine aujourd''hui ?{0}\n\n\
Appelle get_context, puis propose une recette qui respecte les contraintes alimentaires de chaque membre et nos préférences d''appareils, utilise si possible ce qu''il y a dans le garde-manger et tient dans notre temps de préparation habituel. Cherche d''abord dans notre livre de recettes (search_recipes), en privilégiant les recettes que nous avons tous bien notées et pas cuisinées récemment. Si rien ne convient, propose une nouvelle recette et offre de l''enregistrer avec save_recipe. Présente-la avec ses ingrédients, ses étapes et les réglages de l''appareil.
prompt.recipe_of_the_day.craving=\ J''ai envie de : {0}.
prompt.rate_a_recipe=Je veux noter une recette que j''ai cuisinée{0}.\n\n\
Appelle get_context : recipesToRate liste les recettes servies récemment que je n''ai pas encore notées ; sinon, trouve la recette avec search_recipes. Demande-moi une note sur 10 (9 = parfaite, rien à changer ; 10 = la meilleure recette que j''aie jamais goûtée), ce que je changerais la prochaine fois et un commentaire, puis enregistre-la avec rate_recipe. Demande-moi ensuite quels ingrédients sont épuisés, et retire-les du garde-manger avec update_pantry.
prompt.rate_a_recipe.recipe=\ : {0}
prompt.clear_the_fridge=Propose une recette pour finir ce qui reste à la maison.{0}\n\n\
Appelle get_context et get_pantry, puis propose une recette construite surtout avec ce que contient le garde-manger, en respectant les contraintes alimentaires de chaque membre et nos préférences d''appareils. Cherche d''abord dans notre livre de recettes (search_recipes avec les ingrédients principaux). Dis-moi clairement ce qui manque, s''il manque quelque chose. Propose d''enregistrer une nouvelle recette avec save_recipe et, une fois que je l''ai cuisinée, de mettre à jour le garde-manger avec update_pantry.
prompt.clear_the_fridge.ingredients=\ Utilise aussi : {0}.
