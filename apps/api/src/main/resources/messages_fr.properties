onboarding.personal.diet=Suivez-vous un régime particulier (végétarien, végan, halal, pauvre en glucides…), ou mangez-vous de tout ?
onboarding.personal.allergies=Avez-vous des allergies ou des intolérances alimentaires ? Elles seront partagées avec les autres membres de votre foyer, pour que chaque menu du foyer soit sans risque pour vous.
onboarding.personal.allergies.no_consent=Kitchen ne peut enregistrer vos allergies et intolérances qu''avec votre accord, car ce sont des données de santé. Si vous voulez que Kitchen en tienne compte, activez-le sur la page de votre compte : {0}
onboarding.personal.dislikes=Y a-t-il des aliments ou des plats que vous n''aimez pas ?
onboarding.household.table_size=Combien de personnes mangent habituellement à votre table, enfants compris ?
onboarding.household.goals=Qu''est-ce qui compte le plus pour votre foyer en cuisine : manger plus sainement, gagner du temps, faire des économies, découvrir de nouveaux plats, autre chose ?
onboarding.household.max_active_minutes=En semaine, combien de temps pouvez-vous passer à cuisiner, au maximum ?
onboarding.household.budget=Avez-vous un budget alimentation en tête (par semaine ou par repas) ?
onboarding.household.staples=Quels produits de base avez-vous toujours à la maison (huile, riz, pâtes, épices…), pour qu''ils ne soient jamais ajoutés à la liste de courses ?
