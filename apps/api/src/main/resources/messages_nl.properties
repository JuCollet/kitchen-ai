prompt.weekly_menu=Stel het menu van ons huishouden op voor {1} dagen, vanaf {0}.{2}\n\n\
Zo doe je het:\n\
1. Roep get_context aan: respecteer de voedingsbeperkingen van elk lid en onze voorkeuren voor toestellen, en bekijk het laatste menu (herhaal het niet) en de voorraadkast.\n\
2. Tenzij ik iets anders zeg, plan je alleen avondmaaltijden, met porties voor de mensen aan onze tafel.\n\
3. Bouw het vooral op met ons receptenboek (search_recipes): geef de voorkeur aan recepten die we allemaal goed beoordeeld hebben en aan recepten die we lang niet gekookt hebben. Verzin alleen een recept om een gat te vullen of voor afwisseling, en bewaar het met save_recipe voordat je het gebruikt.\n\
4. Toon me het plan (dag, maaltijd, recept, toestel) en laat me het aanpassen.\n\
5. Als ik akkoord ga, bewaar je het met create_menu, met de keuze van toestellen voor de periode.\n\
6. Maak daarna de boodschappenlijst voor het hele menu met create_shopping_list (gekoppeld aan het menu): hoeveelheden opgeteld over de recepten en aangepast aan de porties, elk met zijn afdeling, zonder wat al in de voorraadkast staat en zonder onze basisingrediënten. Toon ze met get_shopping_list.\n\
7. Bied me tot slot de afdrukbare pdf van het menu aan (export_menu_pdf).
prompt.weekly_menu.appliances=\ Toestellen voor deze periode: {0}.
prompt.recipe_of_the_day=Wat koken we vandaag?{0}\n\n\
Roep get_context aan en stel dan één recept voor dat de voedingsbeperkingen van elk lid en onze voorkeuren voor toestellen respecteert, waar mogelijk gebruikt wat in de voorraadkast staat en past in onze gebruikelijke bereidingstijd. Zoek eerst in ons receptenboek (search_recipes) en geef de voorkeur aan recepten die we allemaal goed beoordeeld hebben en lang niet gekookt hebben. Past er niets, stel dan een nieuw recept voor en bied aan het te bewaren met save_recipe. Toon het met de ingrediënten, de stappen en de instellingen van het toestel.
prompt.recipe_of_the_day.craving=\ Ik heb zin in: {0}.
prompt.rate_a_recipe=Ik wil een recept beoordelen dat ik gekookt heb{0}.\n\n\
Roep get_context aan: recipesToRate toont de recepten die onlangs geserveerd zijn en die ik nog niet beoordeeld heb; zoek het recept anders met search_recipes. Vraag me een score op 10 (9 = perfect, niets te veranderen; 10 = het beste recept dat ik ooit geproefd heb), wat ik de volgende keer zou veranderen en een opmerking, en bewaar dat met rate_recipe. Vraag me daarna welke ingrediënten op zijn, en haal ze uit de voorraadkast met update_pantry.
prompt.rate_a_recipe.recipe=: {0}
prompt.clear_the_fridge=Stel een recept voor om op te maken wat er thuis nog is.{0}\n\n\
Roep get_context en get_pantry aan en stel dan een recept voor dat vooral bestaat uit wat in de voorraadkast staat, met respect voor de voedingsbeperkingen van elk lid en onze voorkeuren voor toestellen. Zoek eerst in ons receptenboek (search_recipes met de belangrijkste ingrediënten). Zeg duidelijk wat er ontbreekt, als er iets ontbreekt. Bied aan een nieuw recept te bewaren met save_recipe en, zodra ik het gekookt heb, de voorraadkast bij te werken met update_pantry.
prompt.clear_the_fridge.ingredients=\ Gebruik ook: {0}.

