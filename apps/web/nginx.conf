server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness probe target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Vite names built assets after their content hash: a changed file gets a new name, so they
  # can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path is a React Router route, so serve index.html. It is never
  # cached, so a new deployment is picked up on the next visit.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
